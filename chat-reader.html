<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude 聊天记录阅读器</title>
<style>
:root{color-scheme:light;--bg:#FAF8F5;--panel:#FFFEFC;--line:#E8DDD3;--text:#1A1A1A;--muted:#817873;--accent:#D97757;--accent-dark:#C4653A;--peach:#F5E6D3;--sand:#E8DDD3;--sage:#6B8F71;--human:#F8E9DC;--assistant:#FFFEFC;--thinking:#F8F2EC;--shadow:0 5px 18px rgba(92,61,43,.055)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;font:14px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;color:var(--text);transition:background .18s,border-color .18s,transform .18s}button:hover{background:#F8EDE4;border-color:#E4C7B5}button:active{transform:translateY(1px)}button:disabled{opacity:.4;cursor:not-allowed}.app{height:100dvh;display:flex;flex-direction:column}.topbar{min-height:62px;flex:none;display:flex;align-items:center;gap:13px;padding:0 22px;background:rgba(255,254,252,.94);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(92,61,43,.025)}.brand{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:19px;letter-spacing:-.35px;white-space:nowrap}.brand span{color:var(--accent);margin-right:5px}.topnote{color:var(--muted);font-size:12px}.topactions{margin-left:auto;display:flex;gap:8px}.topactions button:first-child,.welcome button{background:var(--accent);border-color:var(--accent);color:white}.topactions button:first-child:hover,.welcome button:hover{background:var(--accent-dark);border-color:var(--accent-dark)}.layout{display:flex;min-height:0;flex:1}.sidebar{width:310px;flex:none;border-right:1px solid var(--line);background:#F7F2EC;display:flex;flex-direction:column;min-height:0}.sidehead{padding:19px 16px 15px;border-bottom:1px solid var(--line)}.sidehead h2{margin:0 0 12px;font-family:Georgia,"Times New Roman",serif;font-size:19px;font-weight:700}.sidehead input,.searchbar input{width:100%;padding:10px 12px;border:1px solid #E5D9CF;border-radius:10px;background:#FFFEFC;outline:none;transition:border-color .18s,box-shadow .18s}.sidehead input:focus,.searchbar input:focus{border-color:#D99A80;box-shadow:0 0 0 3px rgba(217,119,87,.12)}.listmeta{font-size:12px;color:var(--muted);margin-top:10px}.windowlist{overflow:auto;min-height:0;flex:1}.windowitem{padding:13px 16px;border-bottom:1px solid rgba(218,204,192,.62);cursor:pointer;transition:background .15s;border-left:3px solid transparent}.windowitem:hover{background:#F2E7DD}.windowitem.active{background:#F5E6D3;border-left-color:var(--accent);padding-left:13px}.wtitle{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.45}.wmeta{display:flex;gap:7px;color:var(--muted);font-size:11px;margin-top:5px}.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}.welcome{margin:auto;max-width:600px;padding:38px 32px;text-align:center;color:var(--muted)}.welcome h1{color:var(--text);font-family:Georgia,"Times New Roman",serif;font-size:30px;line-height:1.25;font-weight:700;letter-spacing:-.5px}.welcome .big{font-size:42px;filter:saturate(.75)}.welcome p{line-height:1.9}.welcome button{margin-top:8px;padding:10px 16px}.chathead{padding:13px 20px;background:rgba(255,254,252,.96);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;min-height:68px}.chathead h1{font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.3;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chathead .sub{color:var(--muted);font-size:12px;margin-top:3px}.chathead .heading{min-width:0}.searchbar{display:flex;align-items:center;gap:6px;margin-left:auto}.searchbar input{width:min(280px,24vw)}.searchbar button{padding:7px 10px}.searchcount{font-size:12px;color:var(--muted);white-space:nowrap;min-width:32px}.messages{flex:1;overflow:auto;position:relative;scrollbar-gutter:stable;scroll-behavior:auto}.virtualspace{position:relative;width:100%}.msgslot{position:absolute;left:0;right:0;padding:11px 24px}.msg{max-width:1000px;margin:0 auto;border:1px solid #E9DFD6;border-radius:16px;padding:15px 18px;background:var(--assistant);box-shadow:var(--shadow)}.msg.human{background:var(--human);margin-left:auto;margin-right:0;max-width:min(850px,92%);border-color:#EBD3C0}.msg.assistant{margin-left:0;margin-right:auto;width:min(1000px,100%)}.msghead{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);margin-bottom:9px}.role{font-weight:750;color:#6D625C}.msg.human .role{color:var(--accent-dark)}.stamp{font-variant-numeric:tabular-nums}.content{overflow-wrap:anywhere;font-size:15px;line-height:1.75}.content p{margin:0 0 11px}.content p:last-child{margin-bottom:0}.content h1,.content h2,.content h3{font-family:Georgia,"Times New Roman",serif;line-height:1.3;margin:20px 0 9px}.content h1{font-size:1.45em}.content h2{font-size:1.25em}.content h3{font-size:1.1em}.content ul,.content ol{padding-left:24px}.content li{margin:3px 0}.content pre{background:#302925;color:#FAF8F5;padding:14px;border-radius:10px;overflow:auto;line-height:1.55}.content code{background:#F3EAE2;border-radius:5px;padding:2px 5px;font-family:ui-monospace,SFMono-Regular,monospace;font-size:.9em}.content pre code{background:transparent;padding:0;color:inherit}.content blockquote{border-left:3px solid #D9A58E;margin:12px 0;padding:4px 13px;color:#625650;background:#FBF5F0;border-radius:0 8px 8px 0}.content table{border-collapse:collapse;max-width:100%;display:block;overflow:auto}.content th,.content td{border:1px solid var(--line);padding:7px 10px}.content th{background:#F7F0E9}.content a{color:var(--accent-dark);text-underline-offset:3px}.thinking{margin-top:12px;border:1px solid #E8DDD3;border-radius:10px;background:var(--thinking);overflow:hidden}.thinking summary{padding:9px 12px;cursor:pointer;color:#8A766A;font-size:12px;user-select:none}.thinking .thinkbody{padding:0 12px 12px;color:#756B65;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.empty{padding:50px 20px;text-align:center;color:var(--muted);line-height:1.8}mark{background:#F4D6A8;color:#49352B;border-radius:3px;padding:0 2px}.status{font-size:12px;color:var(--muted)}.mobileback{display:none}
@media(max-width:760px){.topbar{min-height:56px;padding:0 11px;gap:8px}.brand{font-size:15px;letter-spacing:-.2px}.topactions{gap:5px}.topactions button{padding:7px 9px;font-size:12px}.sidebar{width:100%;border:0}.main{display:none}.layout.showchat .sidebar{display:none}.layout.showchat .main{display:flex}.mobileback{display:inline-block;padding:7px 9px;flex:none}.topnote{display:none}.searchbar{gap:4px}.searchbar input{width:min(34vw,145px);padding:8px}.searchbar button{padding:6px 8px}.chathead{padding:10px;gap:7px;min-height:60px}.chathead h1{font-size:16px}.chathead .sub{font-size:11px}.msgslot{padding:7px 9px}.msg{padding:11px 12px;border-radius:13px}.content{font-size:14px;line-height:1.7}.welcome{padding:26px 20px}.welcome h1{font-size:25px}}
@media(max-width:390px){.brand{font-size:13px}.topactions button{padding:6px 7px}.searchbar input{width:95px}.searchcount{min-width:24px;font-size:11px}}

.managebar{display:flex;gap:7px;flex-wrap:wrap;padding:10px 14px;background:#f7f2ec;border-bottom:1px solid var(--line);align-items:center}.managebar button{font-size:12px;padding:7px 10px}.managebar .selectedcount{color:var(--muted);font-size:12px;margin-left:auto}.windowitem{position:relative;padding-left:36px}.windowcheck{position:absolute;left:12px;top:16px;width:16px;height:16px;accent-color:var(--accent)}.msgselect{position:absolute;left:8px;top:16px;accent-color:var(--accent)}.msgslot{position:relative;padding-left:32px}.msgtools{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.msgtools button{font-size:11px;padding:5px 8px}.msg .content{white-space:normal}.progresspill{display:inline-block;padding:2px 7px;border-radius:999px;background:#e8eee7;color:#5b7964;font-size:10px;margin-top:5px}.editbox{width:100%;min-height:180px;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;line-height:1.7}.managebar select{border:1px solid var(--line);background:#fffefa;border-radius:9px;padding:7px;font:inherit;font-size:12px}
@media(max-width:760px){.managebar{padding:8px;gap:5px}.managebar button{padding:6px 7px}.managebar .selectedcount{width:100%;margin-left:0}}
</style>
</head>
<body><div class="app"><header class="topbar"><div class="brand"><span>◉</span> Claude 聊天记录阅读器</div><div class="topnote">本地运行 · 文件不会上传</div><div class="topactions"><button id="openFile">导入 JSON</button><input id="fileInput" type="file" accept=".json,application/json" hidden><button id="clearBtn" title="清空当前导入的数据">清空</button></div></header><div class="layout" id="layout"><aside class="sidebar" id="sidebar"><div class="sidehead"><h2>聊天窗口</h2><input id="windowSearch" placeholder="搜索窗口名称…"><div class="listmeta" id="listmeta">尚未导入文件</div></div><div class="windowlist" id="windowlist"><div class="empty">导入 Claude 导出的 JSON 文件开始阅读。</div></div></aside><main class="main" id="main"><div class="welcome" id="welcome"><div class="big">📚</div><h1>把聊天记录好好保存下来</h1><p>选择 Claude 导出的 JSON 文件。数据只在当前浏览器本地处理，不会上传。<br>长对话采用虚拟滚动，不会一次性渲染所有消息。</p><button id="welcomeImport">选择 JSON 文件</button></div><div id="chatview" hidden style="display:flex;flex-direction:column;min-height:0;flex:1"><div class="chathead"><button class="mobileback" id="backBtn">← 返回</button><div class="heading"><h1 id="chatTitle">对话</h1><div class="sub" id="chatSub"></div></div><div class="searchbar"><input id="messageSearch" placeholder="搜索当前窗口…"><button id="prevHit" title="上一个匹配">↑</button><button id="nextHit" title="下一个匹配">↓</button><span class="searchcount" id="searchCount"></span></div></div><div class="managebar" id="managebar"><button id="selectModeBtn">批量管理</button><button id="selectAllMsgs" hidden>全选消息</button><button id="deleteMsgs" hidden>删除所选消息</button><button id="renameChat">修改标题</button><select id="progressState" title="整理状态"><option value="未整理">未整理</option><option value="整理中">整理中</option><option value="已完成">已完成</option></select><span class="selectedcount" id="selectedCount">整理状态会自动保存</span></div><div class="messages" id="messages"><div class="virtualspace" id="virtualspace"></div></div></div></main></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let rawWindows=[],active=null,activeMessages=[],rendered=new Map(),heights=[],prefix=[],searchHits=[],hitIndex=-1,raf=0,windowFilter='',manageMode=false,selectedMessages=new Set(),selectedWindows=new Set();const STORE='claude-archive-chat-v2';
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function md(src){let s=escapeHTML(String(src??''));const code=[];s=s.replace(/```([^\n`]*)\n([\s\S]*?)```/g,(_,lang,c)=>{code.push('<pre><code>'+c.replace(/\n$/,'')+'</code></pre>');return'\u0000CODE'+(code.length-1)+'\u0000'});s=s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/~~(.+?)~~/g,'<del>$1</del>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');let lines=s.split('\n'),out=[],para=[],listType='';const flush=()=>{if(para.length){out.push('<p>'+para.join('<br>')+'</p>');para=[]}};const closeList=()=>{if(listType){out.push('</'+listType+'>');listType=''}};for(const line of lines){let m;if(!line.trim()){flush();closeList();continue}if((m=line.match(/^(#{1,3})\s+(.+)$/))){flush();closeList();let n=m[1].length;out.push('<h'+n+'>'+m[2]+'</h'+n+'>')}else if((m=line.match(/^\s*[-*+]\s+(.+)$/))){flush();if(listType!=='ul'){closeList();out.push('<ul>');listType='ul'}out.push('<li>'+m[1]+'</li>')}else if((m=line.match(/^\s*\d+\.\s+(.+)$/))){flush();if(listType!=='ol'){closeList();out.push('<ol>');listType='ol'}out.push('<li>'+m[1]+'</li>')}else if((m=line.match(/^&gt;\s?(.*)$/))){flush();closeList();out.push('<blockquote>'+m[1]+'</blockquote>')}else{closeList();para.push(line)}}flush();closeList();return out.join('').replace(/\u0000CODE(\d+)\u0000/g,(_,i)=>code[+i]);}
function getText(content){if(typeof content==='string')return content;if(Array.isArray(content))return content.map(x=>typeof x==='string'?x:(x?.text??x?.content??(x?.type==='image'?'[图片]':''))).filter(Boolean).join('\n');if(content&&typeof content==='object')return content.text??content.content??JSON.stringify(content);return''}
function getDate(m){let d=m?.created_at??m?.createdAt??m?.timestamp??m?.updated_at??m?.updatedAt; if(typeof d==='number'){if(d<1e12)d*=1000;d=new Date(d)}else if(d)d=new Date(d);return d&&!isNaN(d)?d:null}
function fmtDate(d){if(!d)return'时间未知';const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}
function normalizeMessages(w){let arr=w.chat_messages??w.messages??w.conversation?.messages??w.turns??[];if(!Array.isArray(arr))return[];return arr.map((m,i)=>{let sender=String(m.sender??m.role??m.author?.role??m.type??'').toLowerCase();let human=['human','user','you'].includes(sender)||sender.includes('human');let content=getText(m.content??m.text??m.message??m.parts);let thinking=getText(m.thinking??m.reasoning??m.thought??m.thinking_content);if(!thinking&&Array.isArray(m.content)){let t=m.content.filter(x=>x&&typeof x==='object'&&/thinking|reasoning/i.test(x.type??'')).map(x=>getText(x.text??x.content));if(t.length)thinking=t.join('\n')}return {id:m.uuid??m.id??i,role:human?'human':'assistant',text:content,thinking,date:getDate(m),rawIndex:i}}).filter(m=>m.text.trim()||m.thinking.trim())}
function getWinName(w,i){return w.name??w.title??w.conversation_title??w.summary??`未命名对话 ${i+1}`}
function getWindows(data){let list=Array.isArray(data)?data:(data?.conversations??data?.chats??data?.data?.conversations??data?.export?.conversations??data?.windows??data?.projects?.flatMap(p=>p.conversations??[])??null);if(!Array.isArray(list))throw Error('没有找到对话数组。请导入 Claude 导出的 conversations JSON 文件。');return list.map((w,i)=>{let arr=w.chat_messages??w.messages??w.conversation?.messages??w.turns??w._archiveMessages;let count=Array.isArray(arr)?arr.length:0;let last=null;if(Array.isArray(arr)&&arr.length)last=getDate(arr[arr.length-1]);return {id:w.uuid??w.id??`window-${i}`,name:getWinName(w,i),count,last,raw:w,index:i}}).filter(w=>w.count>0)}
function saveArchive(){try{localStorage.setItem(STORE,JSON.stringify({version:2,windows:rawWindows,activeId:active?.id||null,progress:Object.fromEntries(rawWindows.map(w=>[w.id,w.progress||'未整理']))}))}catch(e){toast('聊天记录较大，浏览器本地存储空间可能不足；请导出备份')}}
function listWindows(){const el=$('windowlist');el.innerHTML='';let shown=rawWindows.filter(w=>w.name.toLowerCase().includes(windowFilter));$('listmeta').textContent=`${shown.length.toLocaleString()} 个对话 · 共 ${rawWindows.reduce((n,w)=>n+(w._archiveMessages||normalizeMessages(w.raw)).length,0).toLocaleString()} 条消息`;if(!shown.length){el.innerHTML='<div class="empty">没有匹配的窗口</div>';return}let frag=document.createDocumentFragment();shown.forEach(w=>{const d=document.createElement('div');d.className='windowitem'+(active&&active.id===w.id?' active':'');d.innerHTML=`<input class="windowcheck" type="checkbox" aria-label="选择对话" data-window-check="${escapeHTML(w.id)}" ${selectedWindows.has(w.id)?'checked':''} ${manageMode?'':'hidden'}><div class="wtitle">${escapeHTML(w.name)}</div><div class="wmeta"><span>${((w._archiveMessages||normalizeMessages(w.raw)).length).toLocaleString()} 条消息</span><span>·</span><span>${escapeHTML(fmtDate(w.last))}</span></div><span class="progresspill">${escapeHTML(w.progress||'未整理')}</span>`;d.addEventListener('click',e=>{if(e.target.matches('[data-window-check]')){e.stopPropagation();if(e.target.checked)selectedWindows.add(w.id);else selectedWindows.delete(w.id);updateSelectedCount();return}if(manageMode){const cb=d.querySelector('[data-window-check]');cb.checked=!cb.checked;cb.dispatchEvent(new Event('change'));if(cb.checked)selectedWindows.add(w.id);else selectedWindows.delete(w.id);updateSelectedCount()}else openWindow(w)});const cb=d.querySelector('[data-window-check]');cb.addEventListener('change',()=>{if(cb.checked)selectedWindows.add(w.id);else selectedWindows.delete(w.id);updateSelectedCount()});frag.appendChild(d)});el.appendChild(frag)}
function openWindow(w){active=w;activeMessages=w._archiveMessages||normalizeMessages(w.raw);selectedMessages.clear();rendered.clear();heights=activeMessages.map(m=>estimateHeight(m));buildPrefix();searchHits=[];hitIndex=-1;$('messageSearch').value='';$('searchCount').textContent='';$('chatTitle').textContent=w.name;$('chatSub').textContent=`${activeMessages.length.toLocaleString()} 条消息`;$('progressState').value=w.progress||'未整理';$('selectModeBtn').textContent=manageMode?'退出批量管理':'批量管理';$('selectAllMsgs').hidden=!manageMode;$('deleteMsgs').hidden=!manageMode;updateSelectedCount(); $('welcome').hidden=true;$('chatview').hidden=false;$('layout').classList.add('showchat');$('messages').scrollTop=0;listWindows();scheduleRender()}
function estimateHeight(m){let chars=m.text.length;return Math.max(100,Math.min(850,95+Math.ceil(chars/95)*22+(m.thinking?48:0)))}function buildPrefix(){prefix=[0];for(let h of heights)prefix.push(prefix[prefix.length-1]+h)}
function lowerBound(a,x){let l=0,r=a.length;while(l<r){let m=(l+r)>>1;if(a[m]<x)l=m+1;else r=m}return l}
function scheduleRender(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;renderVisible()})}
function renderVisible(){if(!active)return;const box=$('messages'),space=$('virtualspace'),scroll=box.scrollTop,view=box.clientHeight;let start=Math.max(0,lowerBound(prefix,scroll)-2),end=Math.min(activeMessages.length,lowerBound(prefix,scroll+view)+3);const needed=new Set();for(let i=start;i<end;i++)needed.add(i);for(const [i,node] of rendered){if(!needed.has(i)){node.remove();rendered.delete(i)}}space.style.height=(prefix[prefix.length-1]||0)+'px';let changed=false;for(let i=start;i<end;i++){let node=rendered.get(i);if(!node){node=document.createElement('div');node.className='msgslot';node.dataset.index=i;node.innerHTML=messageHTML(activeMessages[i],i);node.style.top=(prefix[i]||0)+'px';space.appendChild(node);rendered.set(i,node)}const h=Math.ceil(node.getBoundingClientRect().height);if(h>0&&Math.abs(h-heights[i])>3){heights[i]=h;changed=true}}if(changed)buildPrefix();space.style.height=(prefix[prefix.length-1]||0)+'px';for(const [i,node] of rendered){node.style.top=(prefix[i]||0)+'px';node.style.minHeight='0'}bindMessageActions()}
function bindMessageActions(){const space=$('virtualspace');space.querySelectorAll('[data-msg-check]').forEach(cb=>cb.onchange=()=>{const i=Number(cb.dataset.msgCheck);if(cb.checked)selectedMessages.add(i);else selectedMessages.delete(i);updateSelectedCount()});space.querySelectorAll('[data-edit-msg]').forEach(b=>b.onclick=()=>editMessage(Number(b.dataset.editMsg)));space.querySelectorAll('[data-delete-msg]').forEach(b=>b.onclick=()=>deleteMessage(Number(b.dataset.deleteMsg)));space.querySelectorAll('[data-to-memory]').forEach(b=>b.onclick=()=>sendToMemory(Number(b.dataset.toMemory)))}
function updateSelectedCount(){const n=selectedMessages.size;const wn=selectedWindows.size;$('selectedCount').textContent=manageMode?`已选 ${n} 条消息 · ${wn} 个对话`:`整理状态：${active?.progress||'未整理'}`}
function rerenderActive(){if(!active)return;active._archiveMessages=activeMessages;active.count=activeMessages.length;saveArchive();rendered.clear();$('virtualspace').innerHTML='';heights=activeMessages.map(estimateHeight);buildPrefix();$('chatSub').textContent=`${activeMessages.length.toLocaleString()} 条消息`;scheduleRender();listWindows()}
function editMessage(i){const m=activeMessages[i];if(!m)return;const text=prompt('编辑这条消息：',m.text);if(text===null)return;m.text=text;rerenderActive();toast('消息已修改并保存')}
function deleteMessage(i){if(!activeMessages[i])return;if(!confirm('确定删除这条消息吗？此操作无法自动撤销。'))return;activeMessages.splice(i,1);selectedMessages.clear();rerenderActive();toast('消息已删除')}
function deleteSelectedMessages(){const ids=[...selectedMessages].sort((a,b)=>b-a);if(!ids.length){toast('先选择要删除的消息');return}if(!confirm(`确定删除选中的 ${ids.length} 条消息吗？此操作无法自动撤销。`))return;ids.forEach(i=>activeMessages.splice(i,1));selectedMessages.clear();rerenderActive();toast(`已删除 ${ids.length} 条消息`)}
function editTitle(){if(!active)return;const name=prompt('修改对话标题：',active.name);if(name===null||!name.trim())return;active.name=name.trim();$('chatTitle').textContent=active.name;saveArchive();listWindows();toast('标题已保存')}
function deleteSelectedWindows(){const ids=[...selectedWindows];if(!ids.length){toast('先选择要删除的对话');return}if(!confirm(`确定删除选中的 ${ids.length} 个对话及其消息吗？此操作无法自动撤销。`))return;rawWindows=rawWindows.filter(w=>!selectedWindows.has(w.id));if(active&&selectedWindows.has(active.id)){active=null;activeMessages=[];$('chatview').hidden=true;$('welcome').hidden=false;$('layout').classList.remove('showchat')}selectedWindows.clear();saveArchive();listWindows();updateSelectedCount();toast(`已删除 ${ids.length} 个对话`)}
function sendToMemory(i){const m=activeMessages[i];if(!m)return;const title=`${active.name} · ${m.role==='human'?'用户':'Claude'}消息`;const body=m.text+(m.thinking?'\n\n思考内容：\n'+m.thinking:'');try{const key='claude-personal-archive-v1';const db=JSON.parse(localStorage.getItem(key)||'{}');db.memory=Array.isArray(db.memory)?db.memory:[];db.memory.unshift({id:`${Date.now()}-${Math.random().toString(16).slice(2)}`,title,body,tags:['来自聊天记录'],updatedAt:new Date().toISOString()});localStorage.setItem(key,JSON.stringify(db));toast('已保存到 Memory')}catch(e){toast('保存失败，请检查浏览器存储空间')}}
function loadSavedArchive(){try{const d=JSON.parse(localStorage.getItem(STORE)||'null');if(d&&Array.isArray(d.windows)){rawWindows=d.windows;rawWindows.forEach(w=>{w.progress=w.progress||'未整理'});listWindows();$('welcome').innerHTML=`<div class="big">📚</div><h1>已恢复上次的聊天记录</h1><p>找到 ${rawWindows.length.toLocaleString()} 个对话。内容和整理状态已从当前浏览器恢复。</p><button id="welcomeImport">导入其他 JSON</button>`;$('welcomeImport').onclick=()=>$('fileInput').click()}}catch(e){}}
function highlightText(text){const rendered=md(text);let q=$('messageSearch').value.trim();if(!q)return rendered;const eq=escapeHTML(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');try{return rendered.replace(new RegExp('('+eq+')','ig'),'<mark>$1</mark>')}catch{return rendered}}
function messageHTML(m,i){let date=fmtDate(m.date),role=m.role==='human'?'Human':'Claude';let body=highlightText(m.text);let thinking=m.thinking?`<details class="thinking"><summary>Thinking · 展开思考过程</summary><div class="thinkbody">${highlightText(m.thinking)}</div></details>`:'';return `<article class="msg ${m.role}" data-message="${i}">${manageMode?`<input class="msgselect" type="checkbox" data-msg-check="${i}" ${selectedMessages.has(i)?'checked':''} aria-label="选择消息">`:''}<div class="msghead"><span class="role">${role}</span><span>·</span><time class="stamp">${escapeHTML(date)}</time></div><div class="content">${body||'<i>（无 response 内容）</i>'}</div>${thinking}${manageMode?`<div class="msgtools"><button data-edit-msg="${i}">编辑消息</button><button data-delete-msg="${i}">删除消息</button><button data-to-memory="${i}">保存到 Memory</button></div>`:''}</article>`}
function doSearch(){if(!active)return;const q=$('messageSearch').value.trim().toLowerCase();searchHits=[];hitIndex=-1;if(q){activeMessages.forEach((m,i)=>{if((m.text+'\n'+m.thinking).toLowerCase().includes(q))searchHits.push(i)});if(searchHits.length)hitIndex=0} $('searchCount').textContent=q?`${searchHits.length?hitIndex+1:0}/${searchHits.length}`:'';rendered.clear();$('virtualspace').innerHTML='';scheduleRender();if(searchHits.length)jumpHit(0)}function jumpHit(dir){if(!searchHits.length)return;hitIndex=(hitIndex+dir+searchHits.length)%searchHits.length;$('searchCount').textContent=`${hitIndex+1}/${searchHits.length}`;const i=searchHits[hitIndex];$('messages').scrollTop=prefix[i]||0;scheduleRender();setTimeout(()=>{let node=rendered.get(i);if(node){node.querySelectorAll('details').forEach(d=>d.open=true);node.scrollIntoView({block:'start',behavior:'smooth'})}},50)}
$('openFile').onclick=$('welcomeImport').onclick=()=>$('fileInput').click();$('fileInput').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());rawWindows=getWindows(data).map(w=>({...w,_archiveMessages:w._archiveMessages||normalizeMessages(w.raw),raw:null,progress:w.progress||'未整理'}));active=null;activeMessages=[];saveArchive();$('chatview').hidden=true;$('welcome').hidden=false;$('layout').classList.remove('showchat');windowFilter='';$('windowSearch').value='';listWindows();$('welcome').innerHTML=`<div class="big">📚</div><h1>导入完成</h1><p>找到 ${rawWindows.length.toLocaleString()} 个有消息的窗口。<br>窗口列表只读取元数据，点击后才解析对应消息。</p>`}catch(err){alert('导入失败：'+err.message+'\n\n请确认选择的是 Claude 导出的 JSON 文件。')}finally{e.target.value=''}});$('windowSearch').addEventListener('input',e=>{windowFilter=e.target.value.toLowerCase();listWindows()});$('messages').addEventListener('scroll',scheduleRender,{passive:true});$('messageSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();jumpHit(e.shiftKey?-1:1)}else if(e.key==='Escape'){e.target.value='';doSearch()}});$('messageSearch').addEventListener('input',()=>{clearTimeout(window._st);window._st=setTimeout(doSearch,180)});$('prevHit').onclick=()=>jumpHit(-1);$('nextHit').onclick=()=>jumpHit(1);$('backBtn').onclick=()=>{$('layout').classList.remove('showchat')};$('selectModeBtn').onclick=()=>{manageMode=!manageMode;selectedMessages.clear();$('selectModeBtn').textContent=manageMode?'退出批量管理':'批量管理';$('selectAllMsgs').hidden=!manageMode;$('deleteMsgs').hidden=!manageMode;rendered.clear();$('virtualspace').innerHTML='';scheduleRender();listWindows();updateSelectedCount()};$('selectAllMsgs').onclick=()=>{selectedMessages=new Set(activeMessages.map((_,i)=>i));rendered.clear();$('virtualspace').innerHTML='';scheduleRender();updateSelectedCount()};$('deleteMsgs').onclick=deleteSelectedMessages;$('renameChat').onclick=editTitle;$('progressState').onchange=()=>{if(active){active.progress=$('progressState').value;saveArchive();listWindows();updateSelectedCount();toast('整理状态已保存')}};$('windowlist').insertAdjacentHTML('beforebegin','<div class="managebar" style="border-bottom:1px solid var(--line)"><button id="manageWindows">管理对话</button><button id="selectAllWindows" hidden>全选对话</button><button id="deleteWindows" hidden>删除所选对话</button><button id="exportChats">导出聊天备份</button></div>');let windowManage=false;$('manageWindows').onclick=()=>{windowManage=!windowManage;manageMode=windowManage;$('manageWindows').textContent=windowManage?'退出管理':'管理对话';$('selectAllWindows').hidden=!windowManage;$('deleteWindows').hidden=!windowManage;selectedWindows.clear();listWindows();updateSelectedCount()};$('selectAllWindows').onclick=()=>{selectedWindows=new Set(rawWindows.map(w=>w.id));listWindows();updateSelectedCount()};$('deleteWindows').onclick=deleteSelectedWindows;$('exportChats').onclick=()=>downloadChatBackup();function downloadChatBackup(){const data={format:'claude-archive-chat-v2',exportedAt:new Date().toISOString(),windows:rawWindows};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='claude-chat-archive-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('clearBtn').onclick=()=>{if(!confirm('清空当前已导入的所有聊天记录？此操作会删除本地保存的数据。'))return;rawWindows=[];saveArchive();active=null;activeMessages=[];rendered.clear();$('windowlist').innerHTML='<div class="empty">导入 Claude 导出的 JSON 文件开始阅读。</div>';$('listmeta').textContent='尚未导入文件';$('chatview').hidden=true;$('welcome').hidden=false;$('welcome').innerHTML='<div class="big">📚</div><h1>把聊天记录好好保存下来</h1><p>选择 Claude 导出的 JSON 文件。数据只在当前浏览器本地处理，不会上传。<br>长对话采用虚拟滚动，不会一次性渲染所有消息。</p><button id="welcomeImport">选择 JSON 文件</button>';$('welcomeImport').onclick=()=>$('fileInput').click()};
loadSavedArchive();
})();
