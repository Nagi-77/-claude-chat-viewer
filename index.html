<body><div class="app"><header class="topbar"><div class="brand"><span>✿</span><div><strong>好好收纳室</strong><small>Claude 手帐档案 · 仅保存在本机</small></div></div><nav class="topnav" aria-label="档案分类"><button class="navbtn active" data-tab="chats">☷ 聊天</button><button class="navbtn" data-tab="memory">♡ Memory</button><button class="navbtn" data-tab="projects">✎ Projects</button><button class="navbtn" data-tab="profile">❀ Profile</button><button class="navbtn" data-tab="artifacts">▧ Artifacts</button><button class="navbtn" data-tab="skills">✧ Skills</button></nav><div class="topactions"><button id="backupBtn">备份</button><button id="restoreBtn">恢复</button><button id="openFile">导入 JSON</button><input id="fileInput" type="file" accept=".json,application/json" hidden><input id="backupInput" type="file" accept=".json,application/json" hidden></div></header><div class="layout" id="layout"><aside class="sidebar" id="sidebar"><div class="sidehead"><h2>聊天窗口</h2><input id="windowSearch" placeholder="搜索窗口名称…"><div class="listmeta" id="listmeta">尚未导入文件</div><div class="toolrow" style="margin-top:10px"><button id="selectAllBtn">选择全部</button><button id="deleteSelectedBtn">删除所选</button></div></div><div class="windowlist" id="windowlist"><div class="empty">导入 Claude 导出的 JSON 文件开始阅读。</div></div></aside><main class="main" id="main"><div class="welcome" id="welcome"><div class="big">📚</div><h1>把聊天记录好好保存下来</h1><p>选择 Claude 导出的 JSON 文件。数据只在当前浏览器本地处理，不会上传。<br>长对话采用虚拟滚动，不会一次性渲染所有消息。</p><button id="welcomeImport">选择 JSON 文件</button></div><div id="chatview" hidden style="display:flex;flex-direction:column;min-height:0;flex:1"><div class="chathead"><button class="mobileback" id="backBtn">← 返回</button><div class="heading"><h1 id="chatTitle">对话</h1><div class="sub" id="chatSub"></div></div><div class="searchbar"><input id="messageSearch" placeholder="搜索当前窗口…"><button id="prevHit" title="上一个匹配">↑</button><button id="nextHit" title="下一个匹配">↓</button><span class="searchcount" id="searchCount"></span></div></div><div class="messages" id="messages"><div class="virtualspace" id="virtualspace"></div></div></div></main></div><section id="workspace" class="workspace"><div class="paperhead"><h1 id="spaceTitle">♡ Memory</h1><p id="spaceDesc">把想留下的东西，认真贴进自己的小本子里。</p><div class="toolrow"><button class="primary" id="addNote">＋ 新建卡片</button><button id="exportData">导出完整备份</button></div></div><div class="collection" id="collection"></div></section></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let rawWindows=[],active=null,activeMessages=[],rendered=new Map(),heights=[],prefix=[],searchHits=[],hitIndex=-1,raf=0,windowFilter='';
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function md(src){let s=escapeHTML(String(src??''));const code=[];s=s.replace(/```([^\n`]*)\n([\s\S]*?)```/g,(_,lang,c)=>{code.push('<pre><code>'+c.replace(/\n$/,'')+'</code></pre>');return'\u0000CODE'+(code.length-1)+'\u0000'});s=s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/~~(.+?)~~/g,'<del>$1</del>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');let lines=s.split('\n'),out=[],para=[],listType='';const flush=()=>{if(para.length){out.push('<p>'+para.join('<br>')+'</p>');para=[]}};const closeList=()=>{if(listType){out.push('</'+listType+'>');listType=''}};for(const line of lines){let m;if(!line.trim()){flush();closeList();continue}if((m=line.match(/^(#{1,3})\s+(.+)$/))){flush();closeList();let n=m[1].length;out.push('<h'+n+'>'+m[2]+'</h'+n+'>')}else if((m=line.match(/^\s*[-*+]\s+(.+)$/))){flush();if(listType!=='ul'){closeList();out.push('<ul>');listType='ul'}out.push('<li>'+m[1]+'</li>')}else if((m=line.match(/^\s*\d+\.\s+(.+)$/))){flush();if(listType!=='ol'){closeList();out.push('<ol>');listType='ol'}out.push('<li>'+m[1]+'</li>')}else if((m=line.match(/^&gt;\s?(.*)$/))){flush();closeList();out.push('<blockquote>'+m[1]+'</blockquote>')}else{closeList();para.push(line)}}flush();closeList();return out.join('').replace(/\u0000CODE(\d+)\u0000/g,(_,i)=>code[+i]);}
function getText(content){if(typeof content==='string')return content;if(Array.isArray(content))return content.map(x=>typeof x==='string'?x:(x?.text??x?.content??(x?.type==='image'?'[图片]':''))).filter(Boolean).join('\n');if(content&&typeof content==='object')return content.text??content.content??JSON.stringify(content);return''}
function getDate(m){let d=m?.created_at??m?.createdAt??m?.timestamp??m?.updated_at??m?.updatedAt; if(typeof d==='number'){if(d<1e12)d*=1000;d=new Date(d)}else if(d)d=new Date(d);return d&&!isNaN(d)?d:null}
function fmtDate(d){if(!d)return'时间未知';const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}
function normalizeMessages(w){let arr=w.chat_messages??w.messages??w.conversation?.messages??w.turns??[];if(!Array.isArray(arr))return[];return arr.map((m,i)=>{let sender=String(m.sender??m.role??m.author?.role??m.type??'').toLowerCase();let human=['human','user','you'].includes(sender)||sender.includes('human');let blocks=Array.isArray(m.content)?m.content.filter(x=>x&&typeof x==='object'):[];let text=typeof m.text==='string'&&m.text.trim()?m.text:getText(blocks.filter(x=>x.type==='text'));if(!text&&typeof m.message==='string')text=m.message;let thinking=getText(m.thinking??m.reasoning??m.thought??m.thinking_content);if(!thinking&&blocks.length)thinking=blocks.filter(x=>/^(thinking|reasoning)$/.test(String(x.type||''))).map(x=>getText(x.thinking??x.text??x.content)).filter(Boolean).join('\n');let tools=blocks.filter(x=>/^(tool_use|tool_result)$/.test(String(x.type||'')));let attachments=[...(Array.isArray(m.attachments)?m.attachments:[]),...(Array.isArray(m.files)?m.files:[])];let fallback=!text&&!thinking&&!tools.length?(attachments.length?'（附件消息，正文为空）':'（空消息，原始记录已保留）'):'';return {id:m.uuid??m.id??i,role:human?'human':'assistant',text,thinking,tools,attachments,date:getDate(m),rawIndex:i,fallback,raw:m}})}
function getWinName(w,i){return w.name??w.title??w.conversation_title??w.summary??`未命名对话 ${i+1}`}
function getWindows(data){let list=Array.isArray(data)?data:(data?.conversations??data?.chats??data?.data?.conversations??data?.export?.conversations??data?.projects?.flatMap(p=>p.conversations??[])??null);if(!Array.isArray(list))throw Error('没有找到对话数组。请导入 Claude 导出的 conversations JSON 文件。');return list.map((w,i)=>{let arr=w.chat_messages??w.messages??w.conversation?.messages??w.turns;let count=Array.isArray(arr)?arr.length:0;let last=null;if(Array.isArray(arr)&&arr.length)last=getDate(arr[arr.length-1]);return {id:w.uuid??w.id??`window-${i}`,name:getWinName(w,i),count,last,raw:w,index:i}}).filter(w=>w.count>0)}
function listWindows(){const el=$('windowlist');el.innerHTML='';let shown=rawWindows.filter(w=>w.name.toLowerCase().includes(windowFilter));$('listmeta').textContent=`${shown.length} 个有消息的窗口 · 共 ${rawWindows.reduce((n,w)=>n+w.count,0).toLocaleString()} 条原始消息`;if(!shown.length){el.innerHTML='<div class="empty">没有匹配的窗口</div>';return}let frag=document.createDocumentFragment();shown.forEach(w=>{const d=document.createElement('div');d.className='windowitem'+(active&&active.id===w.id?' active':'');d.innerHTML=`<div class="wtitle">${escapeHTML(w.name)}</div><div class="wmeta"><span>${w.count.toLocaleString()} 条消息</span><span>·</span><span>${escapeHTML(fmtDate(w.last))}</span></div><label class="pick" title="选择对话"><input type="checkbox" data-pick="${escapeHTML(w.id)}"></label>`;d.addEventListener('click',e=>{if(e.target.closest('.pick'))return;openWindow(w)});frag.appendChild(d)});el.appendChild(frag)}
function openWindow(w){active=w;activeMessages=normalizeMessages(w.raw);persist();rendered.clear();heights=activeMessages.map(m=>estimateHeight(m));buildPrefix();searchHits=[];hitIndex=-1;$('messageSearch').value='';$('searchCount').textContent='';$('chatTitle').textContent=w.name;$('chatSub').textContent=`${activeMessages.length.toLocaleString()} 条消息`; $('welcome').hidden=true;$('chatview').hidden=false;$('layout').classList.add('showchat');$('messages').scrollTop=0;listWindows();scheduleRender()}
function estimateHeight(m){let chars=m.text.length;return Math.max(100,Math.min(850,110+Math.ceil(chars/95)*22+(m.thinking?48:0)+((m.tools||[]).length*65)+((m.attachments||[]).length?55:0)))}function buildPrefix(){prefix=[0];for(let h of heights)prefix.push(prefix[prefix.length-1]+h)}
function lowerBound(a,x){let l=0,r=a.length;while(l<r){let m=(l+r)>>1;if(a[m]<x)l=m+1;else r=m}return l}
function scheduleRender(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;renderVisible()})}
function renderVisible(){if(!active)return;const box=$('messages'),space=$('virtualspace'),scroll=box.scrollTop,view=box.clientHeight;let start=Math.max(0,lowerBound(prefix,scroll)-2),end=Math.min(activeMessages.length,lowerBound(prefix,scroll+view)+3);const needed=new Set();for(let i=start;i<end;i++)needed.add(i);for(const [i,node] of rendered){if(!needed.has(i)){node.remove();rendered.delete(i)}}space.style.height=(prefix[prefix.length-1]||0)+'px';let changed=false;for(let i=start;i<end;i++){let node=rendered.get(i);if(!node){node=document.createElement('div');node.className='msgslot';node.dataset.index=i;node.innerHTML=messageHTML(activeMessages[i],i);node.style.top=(prefix[i]||0)+'px';space.appendChild(node);rendered.set(i,node)}const h=Math.ceil(node.getBoundingClientRect().height);if(h>0&&Math.abs(h-heights[i])>3){heights[i]=h;changed=true}}if(changed)buildPrefix();space.style.height=(prefix[prefix.length-1]||0)+'px';for(const [i,node] of rendered){node.style.top=(prefix[i]||0)+'px';node.style.minHeight='0'}}
function highlightText(text){const rendered=md(text);let q=$('messageSearch').value.trim();if(!q)return rendered;const eq=escapeHTML(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');try{return rendered.replace(new RegExp('('+eq+')','ig'),'<mark>$1</mark>')}catch{return rendered}}
function messageHTML(m,i){let date=fmtDate(m.date),role=m.role==='human'?'Human':'Claude';let body=highlightText(m.text);let thinking=m.thinking?`<details class="thinking"><summary>Thinking · 展开思考过程</summary><div class="thinkbody">${highlightText(m.thinking)}</div></details>`:'';let toolHTML=(m.tools||[]).map((t,j)=>{let isUse=t.type==='tool_use';let name=escapeHTML(t.name||'未知工具');let detail=escapeHTML(JSON.stringify(isUse?(t.input??{}):(t.content??t.structured_content??t.message??{}),null,2));let label=isUse?'工具调用':'工具结果';return `<details class="thinking toolcard"><summary>⚙ ${label} · ${name}</summary><div class="thinkbody"><pre>${detail}</pre>${t.message?'<p>'+escapeHTML(t.message)+'</p>':''}${t.is_error?'<strong>执行返回错误</strong>':''}</div></details>`}).join('');let att=(m.attachments||[]).length?`<div class="thinking"><summary>附件 · ${(m.attachments||[]).length} 项</summary><div class="thinkbody">${(m.attachments||[]).map(a=>escapeHTML(a.file_name||a.name||a.filename||a.file_uuid||'附件')).join('<br>')}</div></div>`:'';return `<article class="msg ${m.role}" data-message="${i}"><div class="msghead"><span class="role">${role}</span><span>·</span><time class="stamp">${escapeHTML(date)}</time><div class="msgtools"><button data-edit-msg="${i}">编辑</button><button data-save-msg="${i}">存入 Memory</button><button data-delete-msg="${i}">删除</button></div></div><div class="content">${body||'<i>'+escapeHTML(m.fallback||'（无可显示正文）')+'</i>'}</div>${thinking}${toolHTML}${att}</article>`}
function doSearch(){if(!active)return;const q=$('messageSearch').value.trim().toLowerCase();searchHits=[];hitIndex=-1;if(q){activeMessages.forEach((m,i)=>{if((m.text+'\n'+m.thinking+'\n'+JSON.stringify(m.tools||[])).toLowerCase().includes(q))searchHits.push(i)});if(searchHits.length)hitIndex=0} $('searchCount').textContent=q?`${searchHits.length?hitIndex+1:0}/${searchHits.length}`:'';rendered.clear();$('virtualspace').innerHTML='';scheduleRender();if(searchHits.length)jumpHit(0)}function jumpHit(dir){if(!searchHits.length)return;hitIndex=(hitIndex+dir+searchHits.length)%searchHits.length;$('searchCount').textContent=`${hitIndex+1}/${searchHits.length}`;const i=searchHits[hitIndex];$('messages').scrollTop=prefix[i]||0;scheduleRender();setTimeout(()=>{let node=rendered.get(i);if(node){node.querySelectorAll('details').forEach(d=>d.open=true);node.scrollIntoView({block:'start',behavior:'smooth'})}},50)}

// Notebook archive: local persistence, editable notes, bulk conversation management.

const tabInfo={memory:['♡ Memory','留下值得记住的片段、偏好和想法。'],projects:['✎ Projects','正在做的事、计划和进度。'],profile:['❀ Profile','关于自己的资料卡。'],artifacts:['▧ Artifacts','作品、链接、文件线索和成果。'],skills:['✧ Skills','提示词、工作流和可复用技能。']};
function persist(){try{localStorage.setItem(DBKEY,JSON.stringify({notes,reviewState,rawWindows:rawWindows.map(w=>({id:w.id,name:w.name,count:w.count,last:w.last?+w.last: null,raw:w.raw,index:w.index})),activeId:active?.id||null}));}catch(e){alert('本地保存空间不足，建议立即导出完整备份。错误：'+e.message);console.warn('本地保存失败',e);}}
function restoreLocal(){try{let d=JSON.parse(localStorage.getItem(DBKEY)||'{}');if(d.notes)notes={...notes,...d.notes};reviewState=d.reviewState||{};if(Array.isArray(d.rawWindows)&&d.rawWindows.length){rawWindows=d.rawWindows.map(w=>({...w,last:w.last?new Date(w.last):null}));listWindows();if(d.activeId){let w=rawWindows.find(x=>x.id===d.activeId);if(w)openWindow(w)}}}catch(e){console.warn(e)}}
function switchTab(tab){activeTab=tab;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const chat=tab==='chats';$('layout').style.display=chat?'flex':'none';$('workspace').classList.toggle('active',!chat);if(!chat)renderNotes();}
function renderNotes(){const [title,desc]=tabInfo[activeTab]||tabInfo.memory;$('spaceTitle').textContent=title;$('spaceDesc').textContent=desc;const host=$('collection');host.innerHTML='';let arr=notes[activeTab]||[];if(!arr.length){host.innerHTML='<div class="note"><h3>这里还是空白页</h3><p>点“新建卡片”写下第一条内容。你的卡片会自动保存在当前浏览器。</p></div>';return}arr.forEach((n,i)=>{let el=document.createElement('article');el.className='note';el.innerHTML=`<input aria-label="卡片标题" data-title="${i}" value="${escapeHTML(n.title||'未命名卡片').replace(/"/g,'&quot;')}"><textarea aria-label="卡片内容" data-body="${i}">${escapeHTML(n.body||'')}</textarea><div class="row"><span class="status-pill">${escapeHTML(n.status||'未整理')}</span><select data-status="${i}" aria-label="整理状态"><option ${n.status==='未整理'?'selected':''}>未整理</option><option ${n.status==='整理中'?'selected':''}>整理中</option><option ${n.status==='已完成'?'selected':''}>已完成</option></select><button data-remove-note="${i}">删除</button></div>`;host.appendChild(el)});host.querySelectorAll('[data-title]').forEach(e=>e.onchange=()=>{arr[+e.dataset.title].title=e.value;persist()});host.querySelectorAll('[data-body]').forEach(e=>e.onchange=()=>{arr[+e.dataset.body].body=e.value;persist()});host.querySelectorAll('[data-status]').forEach(e=>e.onchange=()=>{arr[+e.dataset.status].status=e.value;persist();renderNotes()});host.querySelectorAll('[data-remove-note]').forEach(e=>e.onclick=()=>{if(confirm('删除这张卡片？此操作无法撤销。')){arr.splice(+e.dataset.removeNote,1);persist();renderNotes()}})}
function saveMemory(title,body){notes.memory.unshift({title:title||'来自聊天的片段',body,status:'未整理',createdAt:new Date().toISOString()});persist();}
function exportBackup(){let data={format:'haohao-claude-notebook',version:1,exportedAt:new Date().toISOString(),notes,reviewState,conversations:rawWindows.map(w=>({id:w.id,name:w.name,count:w.count,last:w.last?+w.last:null,raw:w.raw,index:w.index}))};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='好好收纳室-完整备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));$('addNote').onclick=()=>{(notes[activeTab]|| (notes[activeTab]=[])).unshift({title:'新卡片',body:'',status:'未整理',createdAt:new Date().toISOString()});persist();renderNotes()};$('exportData').onclick=exportBackup;$('backupBtn').onclick=exportBackup;$('restoreBtn').onclick=()=>$('backupInput').click();$('backupInput').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{let d=JSON.parse(await f.text());if(d.format!=='haohao-claude-notebook')throw Error('这不是收纳室备份文件');if(!confirm('恢复备份会替换当前收纳室中的卡片和聊天数据，建议先导出当前备份。继续吗？'))return;notes={...notes,...(d.notes||{})};reviewState=d.reviewState||{};if(Array.isArray(d.conversations))rawWindows=d.conversations.map(w=>({...w,last:w.last?new Date(w.last):null}));persist();listWindows();renderNotes();alert('备份恢复完成。')}catch(err){alert('恢复失败：'+err.message)}finally{e.target.value=''}};
$('selectAllBtn').onclick=()=>{rawWindows.forEach(w=>selectedWindows.add(w.id));document.querySelectorAll('[data-pick]').forEach(e=>e.checked=true)};$('deleteSelectedBtn').onclick=()=>{let ids=new Set([...document.querySelectorAll('[data-pick]:checked')].map(e=>e.dataset.pick));if(!ids.size){alert('先勾选要删除的对话。');return}if(!confirm(`确定删除选中的 ${ids.size} 个对话？建议先导出备份。`))return;rawWindows=rawWindows.filter(w=>!ids.has(String(w.id)));if(active&&ids.has(String(active.id))){active=null;activeMessages=[];$('chatview').hidden=true;$('welcome').hidden=false}selectedWindows.clear();persist();listWindows()};
$('messages').addEventListener('click',e=>{let edit=e.target.closest('[data-edit-msg]'),del=e.target.closest('[data-delete-msg]'),save=e.target.closest('[data-save-msg]');if(edit){let i=+edit.dataset.editMsg,m=activeMessages[i],slot=rendered.get(i),content=slot?.querySelector('.content');if(!content)return;if(content.isContentEditable){m.text=content.innerText;let source=active.raw.chat_messages??active.raw.messages??active.raw.conversation?.messages??active.raw.turns;let original=Array.isArray(source)?source[m.rawIndex]:null;if(original){if(typeof original.text==='string')original.text=m.text;else if(typeof original.message==='string')original.message=m.text;else if(typeof original.content==='string')original.content=m.text;else original.content=m.text;}content.contentEditable='false';edit.textContent='编辑';persist();scheduleRender()}else{content.contentEditable='true';content.focus();edit.textContent='保存';}return}if(save){let i=+save.dataset.saveMsg,m=activeMessages[i];saveMemory(`${active.name} · ${m.role==='human'?'我':'Claude'}`,m.text);save.textContent='已存入';save.disabled=true;return}if(del){let i=+del.dataset.deleteMsg;if(!confirm('删除这条消息？建议先导出备份。'))return;activeMessages.splice(i,1);let arr=active.raw.chat_messages??active.raw.messages??active.raw.conversation?.messages??active.raw.turns;if(Array.isArray(arr))arr.splice(i,1);active.count=activeMessages.length;heights=activeMessages.map(estimateHeight);buildPrefix();rendered.clear();$('virtualspace').innerHTML='';$('chatSub').textContent=`${activeMessages.length} 条消息`;persist();listWindows();scheduleRender()}});

$('chatTitle').title='双击可修改对话标题';$('chatTitle').ondblclick=()=>{if(!active)return;let v=prompt('修改对话标题',active.name);if(v&&v.trim()){active.name=v.trim();active.raw.name=v.trim();$('chatTitle').textContent=active.name;listWindows();persist()}};

$('openFile').onclick=$('welcomeImport').onclick=()=>$('fileInput').click();$('fileInput').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());const incoming=getWindows(data);let added=0,merged=0,duplicates=0;for(const nw of incoming){let ow=rawWindows.find(w=>String(w.id)===String(nw.id));if(!ow){rawWindows.push(nw);added++;continue}merged++;const oldArr=ow.raw.chat_messages??ow.raw.messages??ow.raw.conversation?.messages??ow.raw.turns;const newArr=nw.raw.chat_messages??nw.raw.messages??nw.raw.conversation?.messages??nw.raw.turns;if(Array.isArray(oldArr)&&Array.isArray(newArr)){const seen=new Set(oldArr.map((m,i)=>String(m.uuid??m.id??('fp:'+JSON.stringify([m.sender??m.role,m.created_at??m.timestamp,m.text,getText(m.content)])))));for(const m of newArr){const key=String(m.uuid??m.id??('fp:'+JSON.stringify([m.sender??m.role,m.created_at??m.timestamp,m.text,getText(m.content)])));if(seen.has(key)){duplicates++;continue}oldArr.push(m);seen.add(key)}oldArr.sort((a,b)=>String(a.created_at??a.timestamp??'').localeCompare(String(b.created_at??b.timestamp??'')));ow.count=oldArr.length;ow.last=oldArr.length?getDate(oldArr[oldArr.length-1]):ow.last;ow.raw.updated_at=nw.raw.updated_at??ow.raw.updated_at;if(!ow.raw.name&&nw.raw.name)ow.raw.name=nw.raw.name;ow.name=ow.raw.name??ow.name}else{ow.raw=nw.raw;ow.count=nw.count;ow.last=nw.last}}rawWindows.sort((a,b)=>String(b.last||'').localeCompare(String(a.last||'')));active=null;activeMessages=[];persist();$('chatview').hidden=true;$('welcome').hidden=false;$('layout').classList.remove('showchat');windowFilter='';$('windowSearch').value='';listWindows();$('welcome').innerHTML=`<div class="big">📚</div><h1>导入完成</h1><p>本次识别 ${incoming.length.toLocaleString()} 个对话。<br>新增 ${added} 个，合并 ${merged} 个，跳过重复消息 ${duplicates} 条。<br>现有记录共 ${rawWindows.length.toLocaleString()} 个对话、${rawWindows.reduce((n,w)=>n+w.count,0).toLocaleString()} 条消息。<br>重复导入同一文件不会重复追加已有消息。</p>`}catch(err){alert('导入失败：'+err.message+'\n\n请确认选择的是 Claude 导出的 JSON 文件。')}finally{e.target.value=''}});$('windowSearch').addEventListener('input',e=>{windowFilter=e.target.value.toLowerCase();listWindows()});$('messages').addEventListener('scroll',scheduleRender,{passive:true});$('messageSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();jumpHit(e.shiftKey?-1:1)}else if(e.key==='Escape'){e.target.value='';doSearch()}});$('messageSearch').addEventListener('input',()=>{clearTimeout(window._st);window._st=setTimeout(doSearch,180)});$('prevHit').onclick=()=>jumpHit(-1);$('nextHit').onclick=()=>jumpHit(1);$('backBtn').onclick=()=>{$('layout').classList.remove('showchat')};$('clearBtn').onclick=()=>{if(!confirm('清空当前聊天列表？这不会删除 Memory 等卡片。建议先备份。'))return;rawWindows=[];active=null;activeMessages=[];persist();rendered.clear();$('windowlist').innerHTML='<div class="empty">导入 Claude 导出的 JSON 文件开始阅读。</div>';$('listmeta').textContent='尚未导入文件';$('chatview').hidden=true;$('welcome').hidden=false;$('welcome').innerHTML='<div class="big">📚</div><h1>把聊天记录好好保存下来</h1><p>选择 Claude 导出的 JSON 文件。数据只在当前浏览器本地处理，不会上传。<br>长对话采用虚拟滚动，不会一次性渲染所有消息。</p><button id="welcomeImport">选择 JSON 文件</button>';$('welcomeImport').onclick=()=>$('fileInput').click()};
