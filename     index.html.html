<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude 聊天记录阅读器</title>
<style>
:root{color-scheme:light;--bg:#f5f5f4;--panel:#fff;--line:#e7e5e4;--text:#292524;--muted:#78716c;--accent:#b45309;--human:#fef3c7;--assistant:#fff;--thinking:#f5f5f4}*{box-sizing:border-box}body{margin:0;font:14px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 11px;color:var(--text)}button:hover{background:#fafaf9}button:disabled{opacity:.4;cursor:not-allowed}.app{height:100dvh;display:flex;flex-direction:column}.topbar{height:58px;flex:none;display:flex;align-items:center;gap:12px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line)}.brand{font-weight:750;font-size:16px;white-space:nowrap}.brand span{color:var(--accent)}.topnote{color:var(--muted);font-size:12px}.topactions{margin-left:auto;display:flex;gap:8px}.layout{display:flex;min-height:0;flex:1}.sidebar{width:310px;flex:none;border-right:1px solid var(--line);background:#fafaf9;display:flex;flex-direction:column;min-height:0}.sidehead{padding:14px;border-bottom:1px solid var(--line)}.sidehead h2{margin:0 0 10px;font-size:14px}.sidehead input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:white;outline-color:#d97706}.listmeta{font-size:12px;color:var(--muted);margin-top:8px}.windowlist{overflow:auto;min-height:0;flex:1}.windowitem{padding:12px 14px;border-bottom:1px solid #eeecea;cursor:pointer}.windowitem:hover{background:#f5f5f4}.windowitem.active{background:#fffbeb;border-left:3px solid var(--accent);padding-left:11px}.wtitle{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wmeta{display:flex;gap:8px;color:var(--muted);font-size:11px;margin-top:4px}.main{flex:1;min-width:0;display:flex;flex-direction:column}.welcome{margin:auto;max-width:580px;padding:32px;text-align:center;color:var(--muted)}.welcome h1{color:var(--text);font-size:24px}.welcome .big{font-size:42px}.welcome p{line-height:1.8}.chathead{padding:12px 18px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;min-height:62px}.chathead h1{font-size:16px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chathead .sub{color:var(--muted);font-size:12px}.chathead .heading{min-width:0}.searchbar{display:flex;align-items:center;gap:6px;margin-left:auto}.searchbar input{width:min(280px,24vw);padding:8px 10px;border:1px solid var(--line);border-radius:8px;outline-color:#d97706}.searchcount{font-size:12px;color:var(--muted);white-space:nowrap}.messages{flex:1;overflow:auto;position:relative;scrollbar-gutter:stable}.virtualspace{position:relative;width:100%}.msgslot{position:absolute;left:0;right:0;padding:10px 20px}.msg{max-width:1000px;margin:0 auto;border:1px solid var(--line);border-radius:13px;padding:13px 15px;background:var(--assistant);box-shadow:0 1px 2px #00000004}.msg.human{background:var(--human);margin-left:auto;margin-right:0;max-width:min(850px,92%);border-color:#f5df9b}.msg.assistant{margin-left:0;margin-right:auto;width:min(1000px,100%)}.msghead{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);margin-bottom:8px}.role{font-weight:750;color:#44403c}.msg.human .role{color:#92400e}.stamp{font-variant-numeric:tabular-nums}.content{overflow-wrap:anywhere}.content p{margin:0 0 10px}.content p:last-child{margin-bottom:0}.content h1,.content h2,.content h3{line-height:1.3;margin:18px 0 8px}.content h1{font-size:1.4em}.content h2{font-size:1.22em}.content h3{font-size:1.08em}.content ul,.content ol{padding-left:24px}.content pre{background:#292524;color:#fafaf9;padding:12px;border-radius:8px;overflow:auto}.content code{background:#f5f5f4;border-radius:4px;padding:2px 4px;font-family:ui-monospace,SFMono-Regular,monospace}.content pre code{background:transparent;padding:0;color:inherit}.content blockquote{border-left:3px solid #d6d3d1;margin:10px 0;padding:3px 12px;color:#57534e}.content table{border-collapse:collapse;max-width:100%;display:block;overflow:auto}.content th,.content td{border:1px solid var(--line);padding:6px 9px}.content a{color:#b45309}.thinking{margin-top:10px;border:1px solid #e7e5e4;border-radius:8px;background:var(--thinking);overflow:hidden}.thinking summary{padding:8px 10px;cursor:pointer;color:#78716c;font-size:12px;user-select:none}.thinking .thinkbody{padding:0 11px 11px;color:#78716c;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.empty{padding:50px 20px;text-align:center;color:var(--muted)}mark{background:#fde68a;color:#292524;border-radius:2px;padding:0 1px}.status{font-size:12px;color:var(--muted)}.mobileback{display:none}@media(max-width:760px){.sidebar{width:100%;border:0}.main{display:none}.layout.showchat .sidebar{display:none}.layout.showchat .main{display:flex}.mobileback{display:inline-block}.topnote{display:none}.searchbar input{width:110px}.chathead{padding:10px}.msgslot{padding:7px 9px}.msg{padding:10px}.brand{font-size:14px}}
</style>
</head>
<body><div class="app"><header class="topbar"><div class="brand"><span>◉</span> Claude 聊天记录阅读器</div><div class="topnote">本地运行 · 文件不会上传</div><div class="topactions"><button id="openFile">导入 JSON</button><input id="fileInput" type="file" accept=".json,application/json" hidden><button id="clearBtn" title="清空当前导入的数据">清空</button></div></header><div class="layout" id="layout"><aside class="sidebar" id="sidebar"><div class="sidehead"><h2>聊天窗口</h2><input id="windowSearch" placeholder="搜索窗口名称…"><div class="listmeta" id="listmeta">尚未导入文件</div></div><div class="windowlist" id="windowlist"><div class="empty">导入 Claude 导出的 JSON 文件开始阅读。</div></div></aside><main class="main" id="main"><div class="welcome" id="welcome"><div class="big">📚</div><h1>把聊天记录好好保存下来</h1><p>选择 Claude 导出的 JSON 文件。数据只在当前浏览器本地处理，不会上传。<br>长对话采用虚拟滚动，不会一次性渲染所有消息。</p><button id="welcomeImport">选择 JSON 文件</button></div><div id="chatview" hidden style="display:flex;flex-direction:column;min-height:0;flex:1"><div class="chathead"><button class="mobileback" id="backBtn">← 返回</button><div class="heading"><h1 id="chatTitle">对话</h1><div class="sub" id="chatSub"></div></div><div class="searchbar"><input id="messageSearch" placeholder="搜索当前窗口…"><button id="prevHit" title="上一个匹配">↑</button><button id="nextHit" title="下一个匹配">↓</button><span class="searchcount" id="searchCount"></span></div></div><div class="messages" id="messages"><div class="virtualspace" id="virtualspace"></div></div></div></main></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let rawWindows=[],active=null,activeMessages=[],rendered=new Map(),heights=[],prefix=[],searchHits=[],hitIndex=-1,raf=0,windowFilter='';
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function md(src){let s=escapeHTML(String(src??''));const code=[];s=s.replace(/```([^\n`]*)\n([\s\S]*?)```/g,(_,lang,c)=>{code.push('<pre><code>'+c.replace(/\n$/,'')+'</code></pre>');return'\u0000CODE'+(code.length-1)+'\u0000'});s=s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/~~(.+?)~~/g,'<del>$1</del>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');let lines=s.split('\n'),out=[],para=[],listType='';const flush=()=>{if(para.length){out.push('<p>'+para.join('<br>')+'</p>');para=[]}};const closeList=()=>{if(listType){out.push('</'+listType+'>');listType=''}};for(const line of lines){let m;if(!line.trim()){flush();closeList();continue}if((m=line.match(/^(#{1,3})\s+(.+)$/))){flush();closeList();let n=m[1].length;out.push('<h'+n+'>'+m[2]+'</h'+n+'>')}else if((m=line.match(/^\s*[-*+]\s+(.+)$/))){flush();if(listType!=='ul'){closeList();out.push('<ul>');listType='ul'}out.push('<li>'+m[1]+'</li>')}else if((m=line.match(/^\s*\d+\.\s+(.+)$/))){flush();if(listType!=='ol'){closeList();out.push('<ol>');listType='ol'}out.push('<li>'+m[1]+'</li>')}else if((m=line.match(/^&gt;\s?(.*)$/))){flush();closeList();out.push('<blockquote>'+m[1]+'</blockquote>')}else{closeList();para.push(line)}}flush();closeList();return out.join('').replace(/\u0000CODE(\d+)\u0000/g,(_,i)=>code[+i]);}
function getText(content){if(typeof content==='string')return content;if(Array.isArray(content))return content.map(x=>typeof x==='string'?x:(x?.text??x?.content??(x?.type==='image'?'[图片]':''))).filter(Boolean).join('\n');if(content&&typeof content==='object')return content.text??content.content??JSON.stringify(content);return''}
function getDate(m){let d=m?.created_at??m?.createdAt??m?.timestamp??m?.updated_at??m?.updatedAt; if(typeof d==='number'){if(d<1e12)d*=1000;d=new Date(d)}else if(d)d=new Date(d);return d&&!isNaN(d)?d:null}
function fmtDate(d){if(!d)return'时间未知';const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}
function normalizeMessages(w){let arr=w.chat_messages??w.messages??w.conversation?.messages??w.turns??[];if(!Array.isArray(arr))return[];return arr.map((m,i)=>{let sender=String(m.sender??m.role??m.author?.role??m.type??'').toLowerCase();let human=['human','user','you'].includes(sender)||sender.includes('human');let content=getText(m.content??m.text??m.message??m.parts);let thinking=getText(m.thinking??m.reasoning??m.thought??m.thinking_content);if(!thinking&&Array.isArray(m.content)){let t=m.content.filter(x=>x&&typeof x==='object'&&/thinking|reasoning/i.test(x.type??'')).map(x=>getText(x.text??x.content));if(t.length)thinking=t.join('\n')}return {id:m.uuid??m.id??i,role:human?'human':'assistant',text:content,thinking,date:getDate(m),rawIndex:i}}).filter(m=>m.text.trim()||m.thinking.trim())}
function getWinName(w,i){return w.name??w.title??w.conversation_title??w.summary??`未命名对话 ${i+1}`}
function getWindows(data){let list=Array.isArray(data)?data:(data?.conversations??data?.chats??data?.data?.conversations??data?.export?.conversations??data?.projects?.flatMap(p=>p.conversations??[])??null);if(!Array.isArray(list))throw Error('没有找到对话数组。请导入 Claude 导出的 conversations JSON 文件。');return list.map((w,i)=>{let arr=w.chat_messages??w.messages??w.conversation?.messages??w.turns;let count=Array.isArray(arr)?arr.length:0;let last=null;if(Array.isArray(arr)&&arr.length)last=getDate(arr[arr.length-1]);return {id:w.uuid??w.id??`window-${i}`,name:getWinName(w,i),count,last,raw:w,index:i}}).filter(w=>w.count>0)}
function listWindows(){const el=$('windowlist');el.innerHTML='';let shown=rawWindows.filter(w=>w.name.toLowerCase().includes(windowFilter));$('listmeta').textContent=`${shown.length} 个有消息的窗口 · 共 ${rawWindows.reduce((n,w)=>n+w.count,0).toLocaleString()} 条原始消息`;if(!shown.length){el.innerHTML='<div class="empty">没有匹配的窗口</div>';return}let frag=document.createDocumentFragment();shown.forEach(w=>{const d=document.createElement('div');d.className='windowitem'+(active&&active.id===w.id?' active':'');d.innerHTML=`<div class="wtitle">${escapeHTML(w.name)}</div><div class="wmeta"><span>${w.count.toLocaleString()} 条消息</span><span>·</span><span>${escapeHTML(fmtDate(w.last))}</span></div>`;d.addEventListener('click',()=>openWindow(w));frag.appendChild(d)});el.appendChild(frag)}
function openWindow(w){active=w;activeMessages=normalizeMessages(w.raw);rendered.clear();heights=activeMessages.map(m=>estimateHeight(m));buildPrefix();searchHits=[];hitIndex=-1;$('messageSearch').value='';$('searchCount').textContent='';$('chatTitle').textContent=w.name;$('chatSub').textContent=`${activeMessages.length.toLocaleString()} 条消息`; $('welcome').hidden=true;$('chatview').hidden=false;$('layout').classList.add('showchat');$('messages').scrollTop=0;listWindows();scheduleRender()}
function estimateHeight(m){let chars=m.text.length;return Math.max(100,Math.min(850,95+Math.ceil(chars/95)*22+(m.thinking?48:0)))}function buildPrefix(){prefix=[0];for(let h of heights)prefix.push(prefix[prefix.length-1]+h)}
function lowerBound(a,x){let l=0,r=a.length;while(l<r){let m=(l+r)>>1;if(a[m]<x)l=m+1;else r=m}return l}
function scheduleRender(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;renderVisible()})}
function renderVisible(){if(!active)return;const box=$('messages'),space=$('virtualspace'),scroll=box.scrollTop,view=box.clientHeight;let start=Math.max(0,lowerBound(prefix,scroll)-2),end=Math.min(activeMessages.length,lowerBound(prefix,scroll+view)+3);space.style.height=prefix[prefix.length-1]+'px';const needed=new Set();for(let i=start;i<end;i++)needed.add(i);for(const [i,node] of rendered){if(!needed.has(i)){node.remove();rendered.delete(i)}}for(let i=start;i<end;i++){let node=rendered.get(i);if(!node){node=document.createElement('div');node.className='msgslot';node.dataset.index=i;node.innerHTML=messageHTML(activeMessages[i],i);space.appendChild(node);rendered.set(i,node);const h=node.getBoundingClientRect().height+20;if(Math.abs(h-heights[i])>3){let delta=h-heights[i];heights[i]=h;for(let j=i+1;j<prefix.length;j++)prefix[j]+=delta;space.style.height=prefix[prefix.length-1]+'px'}}node.style.top=prefix[i]+'px';node.style.minHeight='0'} }
function highlightText(text){const rendered=md(text);let q=$('messageSearch').value.trim();if(!q)return rendered;const eq=escapeHTML(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');try{return rendered.replace(new RegExp('('+eq+')','ig'),'<mark>$1</mark>')}catch{return rendered}}
function messageHTML(m,i){let date=fmtDate(m.date),role=m.role==='human'?'Human':'Claude';let body=highlightText(m.text);let thinking=m.thinking?`<details class="thinking"><summary>Thinking · 展开思考过程</summary><div class="thinkbody">${highlightText(m.thinking)}</div></details>`:'';return `<article class="msg ${m.role}" data-message="${i}"><div class="msghead"><span class="role">${role}</span><span>·</span><time class="stamp">${escapeHTML(date)}</time></div><div class="content">${body||'<i>（无 response 内容）</i>'}</div>${thinking}</article>`}
function doSearch(){if(!active)return;const q=$('messageSearch').value.trim().toLowerCase();searchHits=[];hitIndex=-1;if(q){activeMessages.forEach((m,i)=>{if((m.text+'\n'+m.thinking).toLowerCase().includes(q))searchHits.push(i)});if(searchHits.length)hitIndex=0} $('searchCount').textContent=q?`${searchHits.length?hitIndex+1:0}/${searchHits.length}`:'';rendered.clear();$('virtualspace').innerHTML='';scheduleRender();if(searchHits.length)jumpHit(0)}function jumpHit(dir){if(!searchHits.length)return;hitIndex=(hitIndex+dir+searchHits.length)%searchHits.length;$('searchCount').textContent=`${hitIndex+1}/${searchHits.length}`;const i=searchHits[hitIndex];$('messages').scrollTop=prefix[i]||0;scheduleRender();setTimeout(()=>{let node=rendered.get(i);if(node){node.querySelectorAll('details').forEach(d=>d.open=true);node.scrollIntoView({block:'start',behavior:'smooth'})}},50)}
$('openFile').onclick=$('welcomeImport').onclick=()=>$('fileInput').click();$('fileInput').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());rawWindows=getWindows(data);active=null;activeMessages=[];$('chatview').hidden=true;$('welcome').hidden=false;$('layout').classList.remove('showchat');windowFilter='';$('windowSearch').value='';listWindows();$('welcome').innerHTML=`<div class="big">📚</div><h1>导入完成</h1><p>找到 ${rawWindows.length.toLocaleString()} 个有消息的窗口。<br>窗口列表只读取元数据，点击后才解析对应消息。</p>`}catch(err){alert('导入失败：'+err.message+'\n\n请确认选择的是 Claude 导出的 JSON 文件。')}finally{e.target.value=''}});$('windowSearch').addEventListener('input',e=>{windowFilter=e.target.value.toLowerCase();listWindows()});$('messages').addEventListener('scroll',scheduleRender,{passive:true});$('messageSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();jumpHit(e.shiftKey?-1:1)}else if(e.key==='Escape'){e.target.value='';doSearch()}});$('messageSearch').addEventListener('input',()=>{clearTimeout(window._st);window._st=setTimeout(doSearch,180)});$('prevHit').onclick=()=>jumpHit(-1);$('nextHit').onclick=()=>jumpHit(1);$('backBtn').onclick=()=>{$('layout').classList.remove('showchat')};$('clearBtn').onclick=()=>{rawWindows=[];active=null;activeMessages=[];rendered.clear();$('windowlist').innerHTML='<div class="empty">导入 Claude 导出的 JSON 文件开始阅读。</div>';$('listmeta').textContent='尚未导入文件';$('chatview').hidden=true;$('welcome').hidden=false;$('welcome').innerHTML='<div class="big">📚</div><h1>把聊天记录好好保存下来</h1><p>选择 Claude 导出的 JSON 文件。数据只在当前浏览器本地处理，不会上传。<br>长对话采用虚拟滚动，不会一次性渲染所有消息。</p><button id="welcomeImport">选择 JSON 文件</button>';$('welcomeImport').onclick=()=>$('fileInput').click()};
})();
</script></body></html>
